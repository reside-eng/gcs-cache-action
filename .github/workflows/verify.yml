name: Verify

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: verify-${{ github.event_name == 'merge_group' && github.ref || github.head_ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  NODE_VERSION: 24.x

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare environment
        id: prepare-env
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            echo "IN_MERGE_QUEUE=true" >> $GITHUB_ENV
            temp_name=${GITHUB_REF_NAME#gh-readonly-queue/main/pr-}
            pr_number="${temp_name%-*}"
            echo "PR_NUMBER=${pr_number}" >> $GITHUB_ENV
          else
            echo "IN_MERGE_QUEUE=false" >> $GITHUB_ENV
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Skip decision at step level so the required 'build' context always reports
      - name: Check if PR already up-to-date
        id: mq-check-pr-uptodate
        uses: reside-eng/workflow-templates-library/.github/actions/mq-check-uptodate@v1
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ env.PR_NUMBER }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        run: npm ci

      - name: Test
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        run: npm test

      # Bundles dist/main + dist/post, i.e. what consumers actually run
      - name: Build
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        run: npm run package

  lint:
    name: lint
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Prepare environment
        id: prepare-env
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            echo "IN_MERGE_QUEUE=true" >> $GITHUB_ENV
            temp_name=${GITHUB_REF_NAME#gh-readonly-queue/main/pr-}
            pr_number="${temp_name%-*}"
            echo "PR_NUMBER=${pr_number}" >> $GITHUB_ENV
          else
            echo "IN_MERGE_QUEUE=false" >> $GITHUB_ENV
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if PR already up-to-date
        id: mq-check-pr-uptodate
        uses: reside-eng/workflow-templates-library/.github/actions/mq-check-uptodate@v1
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ env.PR_NUMBER }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        run: npm ci

      - name: Lint
        if: env.IN_MERGE_QUEUE != 'true' || env.PR_UPTODATE != 'true'
        run: npm run lint
